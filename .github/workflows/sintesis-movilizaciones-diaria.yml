name: Síntesis diaria movilizaciones SSC

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-ssc.txt

      - name: Verificar secretos SMTP
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
        run: |
          test -n "$SSC_SMTP_HOST" || (echo "FALTA: SSC_SMTP_HOST" && exit 1)
          test -n "$SSC_SMTP_USER" || (echo "FALTA: SSC_SMTP_USER" && exit 1)
          test -n "$SSC_SMTP_PASSWORD" || (echo "FALTA: SSC_SMTP_PASSWORD" && exit 1)
          echo "Secretos OK"

      - name: Descargar PDF SSC
        run: |
          mkdir -p data
          PDF_URL=$(python3 -c "import json; c=json.load(open('data/ssc_config.json')); print(c['pdf_url'])")
          PDF_BACKUP=$(python3 -c "import json; c=json.load(open('data/ssc_config.json')); print(c.get('pdf_url_respaldo',''))")
          download_pdf() {
            curl -fL --retry 6 --retry-delay 20 --retry-all-errors \
              --connect-timeout 45 --max-time 600 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Referer: https://www.ssc.cdmx.gob.mx/" \
              -H "Accept: application/pdf,*/*" \
              -o data/.ssc_agenda_cache.pdf "$1"
          }
          if ! download_pdf "$PDF_URL"; then
            echo "URL principal falló, probando respaldo..."
            download_pdf "$PDF_BACKUP"
          fi
          ls -la data/.ssc_agenda_cache.pdf

      - name: Parsear agenda SSC
        run: |
          python3 scripts/sync_movilizaciones_ssc.py --from-cache
          test -f data/movilizaciones_ssc.json

      - name: Generar síntesis y enviar correo
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
          SSC_SMTP_FROM: ${{ secrets.SSC_SMTP_FROM }}
        run: python3 scripts/generar_sintesis_ssc.py --enviar-correo
