name: Síntesis diaria movilizaciones SSC

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-ssc.txt

      - name: Verificar secretos SMTP
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
        run: |
          test -n "$SSC_SMTP_HOST" || (echo "FALTA secreto: SSC_SMTP_HOST" && exit 1)
          test -n "$SSC_SMTP_USER" || (echo "FALTA secreto: SSC_SMTP_USER" && exit 1)
          test -n "$SSC_SMTP_PASSWORD" || (echo "FALTA secreto: SSC_SMTP_PASSWORD" && exit 1)
          echo "Secretos SMTP OK"

      - name: Descargar PDF SSC
        run: |
          python3 <<'PY'
          import json, re, time, urllib.request
          from pathlib import Path

          cfg = json.load(open("data/ssc_config.json", encoding="utf-8"))
          page = (cfg.get("agenda_page_url") or "").strip()
          referer = page or "https://www.ssc.cdmx.gob.mx/"
          base_headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9",
          }
          urls: list[str] = []
          seen: set[str] = set()

          def add(url: str) -> None:
              url = (url or "").strip()
              if url and url not in seen:
                  seen.add(url)
                  urls.append(url)

          if page:
              try:
                  print(f"Leyendo página agenda: {page}")
                  req = urllib.request.Request(
                      page,
                      headers={
                          **base_headers,
                          "Accept": "text/html,application/xhtml+xml,*/*",
                          "Referer": "https://www.ssc.cdmx.gob.mx/",
                      },
                  )
                  html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
                  for url in re.findall(
                      r'(?:src|href)="(https?://[^"]+Movilizaciones[^"]*\.pdf[^"]*)"',
                      html,
                      re.I,
                  ):
                      add(url)
                  print(f"Enlaces PDF en página: {len(urls)}")
              except Exception as exc:
                  print(f"Página agenda no disponible: {exc}")

          for url in (cfg.get("pdf_url"), cfg.get("pdf_url_respaldo")):
              add(url)

          if not urls:
              raise SystemExit("ERROR: no hay URLs de PDF")

          cache = Path("data/.ssc_agenda_cache.pdf")
          cache.parent.mkdir(parents=True, exist_ok=True)
          pdf_headers = {
              **base_headers,
              "Accept": "application/pdf,application/octet-stream,*/*",
              "Referer": referer,
          }
          last_error = None
          for url in urls:
              for attempt in range(1, 5):
                  try:
                      print(f"Descargando: {url} (intento {attempt}/4)")
                      req = urllib.request.Request(url, headers=pdf_headers)
                      data = urllib.request.urlopen(req, timeout=180).read()
                      if len(data) < 1000:
                          raise RuntimeError(f"PDF demasiado pequeño ({len(data)} bytes)")
                      cache.write_bytes(data)
                      print(f"OK — PDF guardado: {cache} ({len(data)} bytes)")
                      raise SystemExit(0)
                  except Exception as exc:
                      last_error = exc
                      print(f"Fallo: {exc}")
                      if attempt < 4:
                          time.sleep(attempt * 20)
          raise SystemExit(f"ERROR: no se descargó el PDF: {last_error}")
          PY
          test -f data/.ssc_agenda_cache.pdf || (echo "ERROR: no se descargó el PDF" && exit 1)
          ls -la data/.ssc_agenda_cache.pdf

      - name: Parsear agenda SSC
        run: |
          python3 scripts/sync_movilizaciones_ssc.py --from-cache
          test -f data/movilizaciones_ssc.json || (echo "ERROR: no se generó movilizaciones_ssc.json" && exit 1)

      - name: Generar síntesis y enviar correo
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
          SSC_SMTP_FROM: ${{ secrets.SSC_SMTP_FROM }}
        run: python3 scripts/generar_sintesis_ssc.py --enviar-correo
