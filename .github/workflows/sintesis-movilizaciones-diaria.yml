name: Síntesis diaria movilizaciones SSC

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-ssc.txt

      - name: Verificar secretos SMTP
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
        run: |
          test -n "$SSC_SMTP_HOST" || (echo "FALTA secreto: SSC_SMTP_HOST" && exit 1)
          test -n "$SSC_SMTP_USER" || (echo "FALTA secreto: SSC_SMTP_USER" && exit 1)
          test -n "$SSC_SMTP_PASSWORD" || (echo "FALTA secreto: SSC_SMTP_PASSWORD" && exit 1)
          echo "Secretos SMTP OK"

      - name: Descargar PDF SSC
        run: |
          set -ex
          date
          mkdir -p data
          REFERER="https://www.ssc.cdmx.gob.mx/ciudadania/agenda-de-movilizaciones-sociales"
          PDF_URL=$(python3 -c "import json; c=json.load(open('data/ssc_config.json')); u=c['pdf_url'].split('?')[0]; print(u)")
          PDF_BACKUP=$(python3 -c "import json; c=json.load(open('data/ssc_config.json')); print(c.get('pdf_url_respaldo','').split('?')[0])")
          OUT=data/.ssc_agenda_cache.pdf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "PDF_URL=$PDF_URL"

          download_pdf() {
            echo ">>> $(date -u) Descargando: $1"
            curl -4 -fL --retry 2 --retry-delay 10 --retry-all-errors \
              --connect-timeout 20 --max-time 420 \
              --speed-limit 500 --speed-time 60 \
              -A "$UA" \
              -H "Referer: $REFERER" \
              -H "Accept: application/pdf,*/*" \
              -o "$OUT" "$1"
            BYTES=$(wc -c < "$OUT")
            echo ">>> $(date -u) Archivo: $BYTES bytes"
            test "$BYTES" -gt 100000
          }

          download_pdf "$PDF_URL" || download_pdf "$PDF_BACKUP"
          ls -la "$OUT"
          date

      - name: Parsear agenda SSC
        run: |
          python3 scripts/sync_movilizaciones_ssc.py --from-cache
          test -f data/movilizaciones_ssc.json || (echo "ERROR: no se generó movilizaciones_ssc.json" && exit 1)

      - name: Generar síntesis y enviar correo
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
          SSC_SMTP_FROM: ${{ secrets.SSC_SMTP_FROM }}
        run: python3 scripts/generar_sintesis_ssc.py --enviar-correo
