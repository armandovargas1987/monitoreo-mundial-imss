name: Síntesis diaria movilizaciones SSC

on:
  schedule:
    # 6:00 a.m. hora Ciudad de México (todos los días)
    - cron: "0 6 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-ssc.txt

      - name: Descargar y parsear agenda SSC
        run: python3 scripts/sync_movilizaciones_ssc.py

      - name: Generar síntesis y enviar correo
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
          SSC_SMTP_FROM: ${{ secrets.SSC_SM TP_FROM }}
        run: python3 scripts/generar_sintesis_ssc.py --enviar-correo 
        Agregar GitHub Action síntesis diaria
