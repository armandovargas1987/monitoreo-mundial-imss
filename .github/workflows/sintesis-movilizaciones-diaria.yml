name: Síntesis diaria movilizaciones SSC

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-ssc.txt

      - name: Verificar secretos SMTP
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
        run: |
          test -n "$SSC_SMTP_HOST" || (echo "FALTA secreto: SSC_SMTP_HOST" && exit 1)
          test -n "$SSC_SMTP_USER" || (echo "FALTA secreto: SSC_SMTP_USER" && exit 1)
          test -n "$SSC_SMTP_PASSWORD" || (echo "FALTA secreto: SSC_SMTP_PASSWORD" && exit 1)
          echo "Secretos SMTP OK"

      - name: Descargar PDF SSC
        run: |
          python3 scripts/sync_movilizaciones_ssc.py --download-only
          test -f data/.ssc_agenda_cache.pdf || (echo "ERROR: no se descargó el PDF" && exit 1)
          ls -la data/.ssc_agenda_cache.pdf

      - name: Parsear agenda SSC
        run: |
          python3 scripts/sync_movilizaciones_ssc.py --from-cache
          test -f data/movilizaciones_ssc.json || (echo "ERROR: no se generó movilizaciones_ssc.json" && exit 1)

      - name: Generar síntesis y enviar correo
        env:
          SSC_SMTP_HOST: ${{ secrets.SSC_SMTP_HOST }}
          SSC_SMTP_USER: ${{ secrets.SSC_SMTP_USER }}
          SSC_SMTP_PASSWORD: ${{ secrets.SSC_SMTP_PASSWORD }}
          SSC_SMTP_FROM: ${{ secrets.SSC_SMTP_FROM }}
        run: python3 scripts/generar_sintesis_ssc.py --enviar-correo
